function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

function toggleMobileNav(){
 const n=document.getElementById("nav");
 const b=document.getElementById("mobile-nav-backdrop");
 const btn=document.getElementById("mobile-menu-btn");
 if(!n)return;
 const open=!n.classList.contains("mobile-open");
 n.classList.toggle("mobile-open",open);
 if(b)b.classList.toggle("open",open);
 if(btn)btn.setAttribute("aria-expanded",String(open));
}
function closeMobileNav(){
 const n=document.getElementById("nav");
 const b=document.getElementById("mobile-nav-backdrop");
 const btn=document.getElementById("mobile-menu-btn");
 if(n)n.classList.remove("mobile-open");
 if(b)b.classList.remove("open");
 if(btn)btn.setAttribute("aria-expanded","false");
}
function renderNav(){
 const n=document.getElementById("nav");
 n.innerHTML=steps.map((s,i)=>`<div class="navitem ${state.step===s?"active":i<steps.indexOf(state.step)?"done":""}" onclick="go('${s}')">${i+1}. ${labels[s]}</div>`).join("")+`<div class="ref-nav"><div class="navitem ${state.step==="reference"?"active":""}" onclick="go('reference')">Quick Reference</div><div class="navitem ${state.step==="vehicles"?"active":""}" onclick="go('vehicles')">Vehicle Reference</div><div class="navitem ${state.step==="special"?"active":""}" onclick="go('special')">Special Rules</div><div class="navitem ${state.step==="strategy"?"active":""}" onclick="go('strategy')">Strategy Points</div><div class="navitem ${state.step==="warlord"?"active":""}" onclick="go('warlord')">Warlord Traits</div><div class="navitem ${state.step==="search"?"active":""}" onclick="go('search')">Search</div></div>`;
}
function shell(eyebrow,title,body,back=true,nextText="NEXT →"){
 document.getElementById("app").innerHTML=`<div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${body}<div class="actions">${back?'<button class="btn" onclick="back()">← BACK</button>':'<span></span>'}<button class="btn primary" onclick="next()">${nextText}</button></div>`;
 renderNav();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMobileNav();});
function go(s){
 closeMobileNav();
 const topPages=["reference","vehicles","special","strategy","warlord","search","mission","twist"];
 if(topPages.includes(s)){
   if(!topPages.includes(state.step)){
     state.returnStep=state.step;
     state.returnScrollY=window.scrollY||0;
   }
   state.step=s; render();
   setTimeout(()=>window.scrollTo({top:0,left:0,behavior:"auto"}),0);
   return;
 }
 if(s==="final" && state.step!=="final"){return;}
 state.step=s; render();
}
function backToBattle(){
 const target=state.returnStep||"course";
 const y=state.returnScrollY||0;
 state.step=target;
 render();
 setTimeout(()=>window.scrollTo({top:y,behavior:"auto"}),0);
}
function back(){
 if(["reference","vehicles","special","strategy","warlord","search"].includes(state.step)){backToBattle();return;}
 const i=steps.indexOf(state.step);if(i>0){state.step=steps[i-1];render();}
}

function next(){
 if(state.step==="reference"){return;}
 if(state.step==="intent"){continueIntent();return;}
 if(state.step==="firstTurn"){continueFirstTurn();return;}
 const i=steps.indexOf(state.step);
 if(i<steps.length-1){
   if(state.step==="muster"&&!validMuster())return;
   state.step=steps[i+1];
   if(state.step==="mission"&&!state.mission)randomMission();
   render();
 }
}
function validMuster(){for(const p of state.p){if(!p.name.trim()){alert("Please enter both player names.");return false}if(!p.faction){alert("Please select both factions.");return false}}return true}
function validIntent(){
 if(!state.firstDeploy){
   alert("Please record who deployed first.");
   return false;
 }
 for(let pi=0;pi<2;pi++){
   if(state.p[pi].intent.length!==2){
     alert(`Player ${pi+1} must select exactly two Commander’s Intent objectives.`);
     return false;
   }
   if(state.p[pi].intent.includes(0) && !state.p[pi].priority){
     alert(`Player ${pi+1} selected Priority Objective but has not chosen its location.`);
     return false;
   }
 }
 return true;
}

function render(){
 if(state.step==="course") renderCourse();
 if(state.step==="muster") renderMuster();
 if(state.step==="mission") renderMission();
 if(state.step==="twist") renderTwist();
 if(state.step==="deploy") renderDeploy();
 if(state.step==="intent") renderIntent();
 if(state.step==="firstTurn") renderFirstTurn();
 if(state.step==="battle") renderBattle();
 if(state.step==="final") renderFinal();
 if(state.step==="reference"||state.step==="vehicles") renderReference();
 if(state.step==="special") renderSpecialRules();
 if(state.step==="strategy") renderStrategyPoints();
 if(state.step==="warlord") renderWarlordTraits();
 if(state.step==="search") renderSearch();
 renderNav();
}

   "Witchfire Psychic Powers":`<p><strong>Using powers:</strong> Mastery Level 1 psykers may invoke one power per player turn; Mastery Level 2+ may invoke two, but never more than two. The same power may not be successfully invoked more than once in a player turn. For every two powers successfully invoked in the turn, subsequent psychic tests suffer a cumulative -1 Leadership penalty. Psykers arriving from Reserve may invoke powers immediately after arriving and before normal Movement. Psychic powers may not be invoked as reactions.</p><p><strong>Targeting:</strong> Unless a power says otherwise, it requires line of sight. A psyker embarked in a transport may target itself or friendly units embarked with it, and may target outside units if an appropriate fire port has line of sight.</p><p><strong>Perils:</strong> Double 1 or double 6 on the psychic test causes Perils even if the power fails. The psyker suffers an automatic wound with no armour save; invulnerable saves and Feel No Pain may prevent it.</p><p><strong>Power types:</strong> Blessings are invoked during the Movement phase and normally last until the start of the psyker’s next turn. Conjurations are invoked at the start of Movement; the unit using one cannot perform other actions that turn, and each selected conjuration may only be successfully cast once per psyker per game. Summoned units arrive using Deep Strike rules. Maledictions are invoked during Movement and normally last until the start of the psyker’s next turn.</p><p><strong>Witchfire variants:</strong> Beams draw a line to a point within range and hit units according to how many models lie under the line. Focused witchfire can target a specific model, with the opposing player choosing the model if the psychic-test roll is within two points below the psyker’s Leadership. Maelstrom powers automatically hit all units in the affected area unless otherwise specified. Nova powers automatically target and hit all enemy units within their maximum range.</p>`,

   "Step 2: First Fire & Overwatch":`<p><strong>First Fire:</strong> The target may Take Cover! or Jink/Evade if allowed, but cannot Return Fire! Overwatch attacks.</p><p><strong>Overwatch:</strong> Models may only fire within the 90° forward arc chosen when entering Overwatch. Overwatch may only target units within 24”.</p><p>Players alternate between First Fire and enemy Overwatch until all eligible units have resolved their attacks.</p>`,
   "Step 3: Regular Fire":`<p><strong>Return Fire!</strong> may only be declared against a normal shooting attack, not First Fire or Overwatch. The reacting unit must be within 24”, must not have fired earlier that turn, Taken Cover!, Jinked/Evaded, or be engaged, and may not split fire. Vehicles may never Return Fire.</p><p>The reaction uses Limited Fire; casualties from the two attacks are removed simultaneously. A unit that Return Fires must also use Limited Fire in its next Shooting phase and suffers the specified assault penalties this turn.</p>`,
   "Step 2: Assault Moves & Reactions":`<p><strong>Stand &amp; Shoot!</strong> is unavailable to a unit that has already fired, Gone to Ground/Jinked, is Broken or Pinned, or is already engaged. Vehicles may never Stand &amp; Shoot!, and the reaction cannot split fire.</p><p><strong>Pile-In:</strong> Defending models move up to 6” sequentially from closest to farthest, prioritising base contact with a charging model and otherwise staying within 1” of an engaged friendly model.</p>`,
   "Step 4: Close Combat Results":`<p><strong>Pursuit:</strong> A winning unit that is no longer locked may pursue with D6 + highest Initiative, ignoring difficult terrain. Reaching the fleeing unit causes automatic pursuit hits; if contact is maintained, the fleeing unit ceases to be Broken.</p><p><strong>Restraint:</strong> Instead of pursuing, take a Leadership test to Consolidate. A voluntary withdrawal automatically passes this test.</p><p><strong>Consolidation:</strong> Restore coherency where necessary and may re-engage an enemy for a melee next turn. A unit that charged this turn may choose Overrun and move D6” instead of 3”. Non-Walker vehicles do not consolidate.</p>`,
   "Vehicle Damage Tables":`<p><strong>Result effects:</strong> Crew Shaken means the vehicle fires with Snap Fire; Crew Stunned prevents movement and uses Snap Fire. Engine Damaged halves movement speed, with additional results halving it again. Weapon Destroyed removes a weapon, with later results selecting another weapon. Immobilized prevents movement/pivoting.</p><p><strong>Wrecked:</strong> The vehicle is destroyed and leaves a wreck; embarked passengers must take a Pinning Test. <strong>Explodes:</strong> replace the vehicle with a crater; models within D6” suffer S4 hits with no cover save, embarked passengers are automatically pinned and suffer an additional automatic hit that wounds on 4+.</p>`,
   "Vehicle Facing":`<p>Models touching the forward arc line count as being in the front arc; models touching the rear arc line count as being in the side arc. If attacking models occupy different arcs, keep their attack rolls separated.</p>`,
   "Vehicle Structure Points (SPs)":`<p>Wrecked and Explodes results automatically spend an available SP to reduce the result by 1. Other damage results may be reduced voluntarily by spending SPs. Flyers and fast skimmers that would be destroyed by Immobilized must spend available SPs to reduce the result below Immobilized if possible.</p>`,
   "Transports":`<p><strong>Access:</strong> Disembarking models must be within 2” of an access point; open-topped vehicles treat the whole hull as an access point. A unit may not embark and disembark in the same turn.</p><p><strong>Emergency Disembarkation:</strong> If a transport suffers penetrating hits but is not destroyed, passengers may disembark after the current attacks are resolved. If the passengers are subsequently exposed to attacks, they use the applicable Shaken/Stunned/Snap Fire restrictions.</p>`,
   "Suppression & Crossfire":`<p>A unit can have no more than six suppression tokens. Suppression also applies a -1 modifier to Leadership tests, including Morale, Pinning, Split Fire and Psychic tests.</p><p><strong>Crossfire:</strong> determine the vehicle/unit’s rearward arc from the direction the unit is facing; when an attack from that arc would cause a suppression token, it causes two instead.</p>`,
   "Screening":`<p>Gaps wider than 2” do not count as part of a screen. Multiple units may form a combined screen if no relevant line of fire passes through a gap wider than 2”. Single-model units never count as screens.</p><p><strong>Shooting into melee:</strong> Roll to hit normally, then roll a D6 for each hit: 4+ hits the intended enemy; 1–3 hits the friendly engaged unit. If several friendly units are involved, use the largest unit, breaking ties by proximity. Add +1 when shooting at a monstrous creature or walker.</p>`,
   "Pinned":`<p><strong>Pinning Test:</strong> use the highest applicable Leadership, with -1 if at half strength, -1 if out of coherency, and -1 for each suppression token.</p><p>A Pinned unit may not Advance, enter Overwatch, or perform Take Cover!, Return Fire!, or Stand &amp; Shoot! reactions.</p>`,
   "Characteristic Tests":`<p><strong>Characteristic Test:</strong> Roll a single D6. The test is passed if the result is equal to or less than the tested characteristic.</p><p><strong>Automatic Pass/Fail:</strong> A natural 6 always fails and a natural 1 always passes, regardless of the characteristic value.</p><p><strong>Leadership Test:</strong> Roll 2D6 and add the results together. The test is passed if the total is equal to or less than the model's Leadership. If a unit contains different Leadership values, use the highest applicable value.</p>`,

   const docs=[];
   holder.querySelectorAll(".ref-card").forEach(cardEl=>{
     const headingEl=cardEl.querySelector(":scope > h3, :scope > h2");
     const heading=headingEl ? headingEl.textContent.trim() : p.title;
     const table=cardEl.querySelector(":scope .ref-table");
     const rows=[...cardEl.querySelectorAll(":scope .ref-table tbody tr")];
     if(rows.length){
       // Keep the complete table as a search result too. This is deliberately
       // separate from row-level indexing: searching for a table/reference
       // name should show the whole chart, while searching for a term such as
       // "Jink" can still return the specific row containing that term.
       const tableText=(table.innerText||table.textContent||"").replace(/\s+/g," ").trim();
       if(tableText){
         docs.push({page:key,section:`Quick Reference · ${p.title}`,title:heading,text:tableText,html:`<div class="search-full-table">${table.outerHTML}</div>`,granular:false,table:true});
       }
       rows.forEach(row=>{
         const cells=[...row.querySelectorAll("td")];
         const text=(row.innerText||row.textContent||"").replace(/\s+/g," ").trim();
         if(!text)return;
         const label=(cells[0]?.innerText||cells[0]?.textContent||heading).replace(/\s+/g," ").trim();
         docs.push({page:key,section:`Quick Reference · ${p.title}`,title:`${heading} — ${label}`,text,html:`<div class="search-row"><table><tbody><tr>${row.innerHTML}</tr></tbody></table></div>`,granular:true});
       });
       const notes=[...cardEl.querySelectorAll(":scope > .ref-note, :scope > .ref-highlight")];
       notes.forEach(note=>{
         const text=(note.innerText||note.textContent||"").replace(/\s+/g," ").trim();
         if(text) docs.push({page:key,section:`Quick Reference · ${p.title}`,title:heading,text,html:`<p class="search-full">${note.innerHTML}</p>`,granular:true});
       });
       return;
     }
     const items=[...cardEl.querySelectorAll(":scope > .ref-list > li, :scope > .ref-list > ul > li")];
     if(items.length){
       items.forEach((item,idx)=>{
         const text=(item.innerText||item.textContent||"").replace(/\s+/g," ").trim();
         if(text) docs.push({page:key,section:`Quick Reference · ${p.title}`,title:heading, text, html:`<p class="search-full">${item.innerHTML}</p>`,granular:true});
       });
       return;
     }
     const text=(cardEl.innerText||cardEl.textContent||"").replace(/\s+/g," ").trim();
     if(text) docs.push({page:key,section:`Quick Reference · ${p.title}`,title:heading,text,html:`<p class="search-full">${text}</p>`,granular:true});
   });

 });

function specialRuleTitle(item){
 const m=item.match(/<strong>([^<]+):<\/strong>/i);
 return m?m[1]:item.replace(/<[^>]+>/g,"").split(/[.:]/)[0].trim();
}
function specialRuleBody(item){
 return item.replace(/^\s*<strong>[^<]+:<\/strong>\s*/i,"");
}
function specialRuleEntry(item){
 const title=specialRuleTitle(item);
 const raw=specialRuleBody(item);
 const text=raw.replace(/<[^>]+>/g,"").trim();
 const cut=text.search(/\.\s+/);
 let summary,detail;
 if(cut>=0 && cut<Math.min(180,text.length-1)){
   const sentenceEnd=cut+1;
   summary=text.slice(0,sentenceEnd);
   detail=raw.slice(raw.indexOf(".")+1).trim();
 }else{
   summary=raw;
   detail="";
 }
 return `<div class="special-rule-entry" data-special-rule="${esc(title).toLowerCase()}">
   <div class="sr-title"><span>${esc(title)}</span><span class="sr-type">SPECIAL RULE</span></div>
   <div class="sr-body"><div class="sr-summary">${summary}</div>
   ${(specialRuleDetailOverrides[title]||detail)?`<div class="sr-more"><button class="more-detail-btn special-more-detail" type="button" onclick="toggleMoreDetail(this)">More Detail</button><div class="more-detail-panel" hidden>${specialRuleDetailOverrides[title]||formatSpecialRuleDetail(title,detail)}</div></div>`:""}
   </div>
 </div>`;
}

function highlightSpecialDetail(html){
 const keywords=[
  "DIRECT FIRE","INDIRECT FIRE","SNAP FIRE","LINE OF SIGHT","RANGE",
  "BALLISTIC SKILL","SCATTER","HIT","MISS","BLAST","TEMPLATE",
  "PINNING TEST","VEHICLE","VEHICLES","STRUCTURES","COVER",
  "ARMOUR PENETRATION","ARMOR PENETRATION","AP","CHARGE",
  "ASSAULT PHASE","SHOOTING PHASE","MOVEMENT PHASE","RESERVE"
 ];
 const re=new RegExp("\\b("+keywords.sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\\]\\\\]/g,"\\$&")).join("|")+")\\b","gi");
 return String(html).split(/(<[^>]+>)/g).map((part,i)=>{
   if(i%2)return part;
   return part.replace(re,m=>`<strong class="detail-keyword">${m}</strong>`);
 }).join("");
}
function formatSpecialRuleDetail(title, detail){
 const clean=String(detail).trim();
 if(!clean)return "";
 // Keep the rule wording intact; improve readability by separating complete
 // sentences into short paragraphs and highlighting key rules terminology.
 const sentences=clean.split(/\\.\\s+(?=[A-Z0-9])/);
 return sentences.map(s=>`<p class="special-detail-paragraph">${highlightSpecialDetail(s.trim())}</p>`).join("");
}


const specialRuleDetailOverrides={
 "Characteristic Tests":`<p><strong>Characteristic Test:</strong> Roll a single D6. The test is passed if the result is equal to or less than the tested characteristic.</p><p><strong>Automatic Pass/Fail:</strong> A natural 6 always fails and a natural 1 always passes, regardless of the characteristic value.</p><p><strong>Leadership Test:</strong> Roll 2D6 and add the results together. The test is passed if the total is equal to or less than the model's Leadership. If a unit contains different Leadership values, use the highest applicable value.</p>`,
 "Artillery":`<p><strong>Profile:</strong> Use the artillery piece's unit-entry profile. If none is specified, it has T6, 1 Wound and a 3+ armour save. If it uses Armour Values, use T6 plus 1 for each point of AV above 10.</p><p><strong>Moving:</strong> Each artillery model needs at least one crew member to move.</p><p><strong>Shooting:</strong> A designated crew member within 2” may fire the artillery instead of their own weapon. Use both the artillery and firing model for line of sight; measure range from the artillery barrel. Unless otherwise noted, artillery cannot shoot after moving and cannot shoot without a designated crew member within 2”.</p><p><strong>Attacked:</strong> Artillery may receive ranged wounds as normal, but does not benefit from the <strong>TAKE COVER!</strong> reaction.</p><p><strong>Melee:</strong> Attacks may be allocated specifically to artillery models and hit on 3+. Artillery cannot fight back.</p><p><strong>Unit Size:</strong> Artillery models do not count toward starting strength, Morale checks or similar unit-size rules.</p><p><strong>Transports:</strong> Cannot be transported unless the specific unit entry says otherwise.</p>`,
 "Buildings & Fortifications":`<p><strong>Occupancy:</strong> Buildings allow INFANTRY to enter through predetermined access points. A standard building normally holds one unit. Transport capacity is set during setup; bunkers default to 10 models.</p><p><strong>Firing Ports:</strong> Buildings may have defined firing ports that allow models inside to fire out.</p><p><strong>Armour Values:</strong> Fortification/Bunker: <strong>14 ranged / 13 melee</strong>. Concrete, stone or heavy metal: <strong>12 / 11</strong>. Wooden, corrugated metal or shed structures: <strong>10 / 9</strong>.</p><p><strong>Damage:</strong> Buildings are attacked like vehicles. Glancing or penetrating hits use the normal Vehicle Damage Table. Weapon Destroyed, Engine Damaged and Immobilized results count as damage when resolving subsequent hits.</p><p><strong>Template:</strong> A Template weapon hitting a building's firing port inflicts D6 automatic hits on the unit inside, in addition to damage to the building.</p>`,
 "Assault":`<p><strong>Firing:</strong> Assault X weapons fire X shots.</p><p><strong>Charging:</strong> A unit that fires Assault weapons may still charge. If the firing model Advanced, it may only fire with <strong>SNAP FIRE</strong>.</p>`,
 "Barrage":`<p><strong>Indirect Fire:</strong> No <strong>LINE OF SIGHT</strong> or Ballistic Skill is required. Centre a <strong>BLAST</strong> marker on a specific model in range and roll <strong>2D6</strong> with the scatter dice. On a <strong>HIT</strong>, the marker hits the target; otherwise it scatters 2D6&quot; in the indicated direction.</p><p><strong>Direct Fire:</strong> Treat the weapon as a <strong>BLAST</strong> weapon under normal shooting rules; minimum range may be disregarded.</p><p><strong>Hits:</strong> Models wholly under the marker are hit automatically; partially covered models are hit on 4+. Unsaved wounds from <strong>INDIRECT FIRE</strong> barrage attacks cause a <strong>PINNING TEST</strong>.</p><p><strong>Multiple Barrage:</strong> Determine the first barrage hit normally. For subsequent shots, roll the scatter dice only (no 2D6) and place each template touching the edge of the first in the direction indicated. On a <strong>HIT</strong>, the template may be placed anywhere touching or overlapping the first.</p><p><strong>Structures:</strong> For indirect fire, the blast marker affects only the topmost level at its position. If it scatters over lower levels, move the marker to the next exposed level below.</p>`,
 "Blast":`<p><strong>Placement:</strong> Centre the marker on a hittable model in the target unit and roll To Hit normally using the firing model's <strong>BS</strong>.</p><p><strong>Hit:</strong> Models wholly under the marker are hit; partially covered models are hit on 4+.</p><p><strong>Miss &amp; Scatter:</strong> Roll the scatter dice and move the marker 2D6&quot; in the indicated direction. On a <strong>HIT</strong>, it still moves in the direction of the smaller arrow. Maximum scatter is half the distance between the firing model and the target location.</p><p><strong>Allocation:</strong> Blast hits and wounds may be allocated to any models in the unit, not only those physically under the marker. If multiple units are hit, resolve each unit separately. Resolve multiple blast weapons one at a time.</p><p><strong>Vehicles:</strong> A vehicle touched by any part of the blast marker is hit automatically; determine the facing from the firing model's position relative to the vehicle's facing arcs.</p><p><strong>Structures:</strong> Position the marker over models at a chosen level. Only models on that level can be hit; if the marker scatters and hits no models on that level, the shot is a complete miss.</p><p><strong>Engagements:</strong> Position blast markers normally and count the total models hit, regardless of which side they are on, before resolving <strong>SHOOTING INTO MELEE COMBAT</strong>.</p>`,
 "Heavy":`<p><strong>Stationary:</strong> A Heavy weapon fires normally if its firing model did not move, even if other models in the unit moved.</p><p><strong>Moved:</strong> The firing model may only use <strong>SNAP FIRE</strong>.</p><p><strong>Charging:</strong> A unit firing Heavy weapons may not charge.</p>`,
 "Ordnance":`<p><strong>Infantry:</strong> Cannot fire Ordnance after moving, even with <strong>SNAP FIRE</strong>.</p><p><strong>Charging:</strong> A unit that fired Ordnance may not charge.</p><p><strong>Vehicles:</strong> A vehicle firing Ordnance cannot fire, or have fired, any other weapons that turn.</p><p><strong>Vehicle Damage:</strong> Roll <strong>2D6</strong> on the Vehicle Damage Table and use the highest result.</p>`,
 "Pistol":`<p><strong>Firing:</strong> Pistol X weapons fire X shots and count as <strong>ASSAULT</strong> weapons.</p><p><strong>Close Combat:</strong> Pistols count as a melee weapon in close combat, but the pistol itself is not fired or used as the close combat weapon.</p>`,
 "Rapid Fire":`<p><strong>Maximum Range:</strong> Fire once.</p><p><strong>Half Range:</strong> Fire twice.</p><p><strong>Charging:</strong> A unit firing Rapid Fire weapons may not charge.</p>`,
 "Salvo":`<p><strong>Salvo X/Y:</strong> If the model moved, fire X shots at up to half maximum range. If it did not move, fire Y shots at maximum range.</p><p><strong>Charging:</strong> A unit firing Salvo weapons may not charge.</p>`,
 "Template":`<p><strong>Placement:</strong> Declare the target normally. Place the narrow end of the teardrop template in base contact with the firing model and align it straight out in the chosen direction. If at least one model in the target unit is hit, the template may also touch models from other units.</p><p><strong>Hits:</strong> Models wholly under the template are hit automatically; partially covered models are hit on 4+.</p><p><strong>Cover:</strong> Template weapons ignore cover saves.</p><p><strong>Allocation:</strong> Template hits and wounds may be allocated to any hittable models, not only the model physically hit by the template.</p><p><strong>Snap Fire:</strong> When firing with <strong>SNAP FIRE</strong>, all models wholly or partially under the template are hit only on 4+.</p><p><strong>Structures:</strong> The template may target the shooting model's level or one level above or below, remaining horizontally flat.</p><p><strong>Engagements:</strong> Use the same process as <strong>BLAST</strong> weapons.</p>`,
 "D-Strength Weapons":`<p><strong>Strength:</strong> Counts as Strength 10 and may re-roll failed wounds.</p><p><strong>Unsaved Wounds:</strong> Each unsaved wound inflicts <strong>D3 wounds</strong>.</p><p><strong>Vehicles:</strong> Re-roll the armour penetration roll and add <strong>+1</strong> to the Vehicle Damage Table result.</p>`
};

function ensureSearchIndex(){
 if(window.__refSearchIndex)return;
 if(!window.__refSearchIndexSeeded){
  window.__refSearchIndexSeeded=true;
  // Build the index from both normal Quick Reference content and the separate
  // Vehicle view. Vehicle tables are intentionally indexed at row level too,
  // so searches such as "Crew stunned" return the actual damage result.
  const oldStep=state.step, oldRefPage=state.refPage, oldShootingView=state.shootingView;

  state.step="reference";
  state.refPage="start";
  state.shootingView="normal";
  renderReference();
  const normalDocs=[...(window.__refSearchIndex||[])];

  state.refPage="shooting";
  state.shootingView="vehicles";
  renderReference();
  const vehicleDocs=[...(window.__refSearchIndex||[])];

  // The Vehicle Reference is a separate page, so scrape its non-table reference
  // cards directly rather than relying on the Quick Reference index. This keeps
  // searches such as "vehicle facing" and "vehicle damage" discoverable.
  state.step="vehicles";
  renderReference();
  const vehicleReferenceDocs=[];
  const vehicleApp=document.getElementById("app");
  const damageCard=vehicleApp?.querySelector(".damage-table")?.closest(".ref-card");
  const facingCard=vehicleApp?.querySelector(".vehicle-facing-box")?.closest(".ref-masonry-col");
  if(damageCard){
    const h=damageCard.querySelector("h3");
    const text=(damageCard.innerText||damageCard.textContent||"").replace(/\s+/g," ").trim();
    vehicleReferenceDocs.push({page:"vehicles",section:"Vehicle Reference",title:h?.textContent.trim()||"Vehicle Damage Tables",text,html:damageCard.outerHTML,granular:false,table:true,vehicleDamage:true});
  }
  if(facingCard){
    const text=(facingCard.innerText||facingCard.textContent||"").replace(/\s+/g," ").trim();
    vehicleReferenceDocs.push({page:"vehicles",section:"Vehicle Reference",title:"Vehicle Facing",text,html:facingCard.outerHTML,granular:true,table:false});
  }

  window.__refSearchIndex=[...normalDocs,...vehicleDocs,...vehicleReferenceDocs];
  state.step=oldStep; state.refPage=oldRefPage; state.shootingView=oldShootingView;
 }
}
function renderSearch(){
 ensureSearchIndex();
 const rawQ=(state.searchQuery||"").trim();
 const q=rawQ.toLowerCase();
 const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
 const nq=norm(rawQ);
 const specialDocs=Object.entries(specialRulesData).flatMap(([section,items])=>items.map((item,idx)=>{
   const clean=item.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
   const m=item.match(/<strong>(.*?)<\/strong>/i);
   const title=m?m[1].replace(/<[^>]*>/g,""):clean.split(/[:—–-]/)[0].trim().slice(0,80);
   return {title,section:"Special Rules · "+section,text:clean,html:`<p class="search-full">${item}</p>`,special:true,index:idx,granular:true,table:false};
 }));
 const docs=[...(window.__refSearchIndex||[]),...specialDocs,
   {title:"Strategy Points",section:"Strategy Points",text:strategyPointsHTML.replace(/<[^>]+>/g," "),html:strategyPointsHTML,granular:true,table:false},
   {title:"Warlord Traits",section:"Warlord Traits",text:warlordTraitsHTML.replace(/<[^>]+>/g," "),html:warlordTraitsHTML,granular:true,table:false},
   {title:"Concessions",section:"Battle Companion · Deployment",text:concessionsHTML.replace(/<[^>]+>/g," "),html:concessionsHTML,granular:true,table:false}
 ];
 let matches=q?docs.filter(d=>norm(`${d.title} ${d.section} ${d.text}`).includes(nq)).sort((a,b)=>{
   const score=d=>{
     const t=norm(d.title), txt=norm(d.text);
     // "Vehicle Damage" is a deliberate quick-reference exception: players
     // searching for it should land on the complete damage table first.
     if(d.vehicleDamage && (nq==="vehicle damage" || nq==="vehicle damage table" || nq==="vehicle damage tables")) return -10;
     // Exact named Special Rules are the highest-priority result.
     if(d.special && t===nq) return 0;
     if(d.special && t.startsWith(nq+" ")) return 1;
     if(d.special && t.includes(nq)) return 2;
     // Specific rule/row matches should always beat whole-table results.
     const titleExact=t===nq;
     const titleStart=t.startsWith(nq+" ");
     const titleContains=t.includes(nq);
     const textStarts=txt.startsWith(nq+" ") || txt===nq;
     if(d.granular && titleExact) return 3;
     if(d.granular && titleStart) return 4;
     if(d.granular && titleContains) return 5;
     if(d.granular && textStarts) return 6;
     if(d.granular) return 7;
     // Whole tables are deliberately pushed to the bottom of results.
     if(d.table && titleExact) return 90;
     if(d.table && titleStart) return 91;
     if(d.table && titleContains) return 92;
     return 99;
   };
   return score(a)-score(b);
 }):[];

}
function renderBattle(){
 if(!state.mission)state.mission=Object.keys(missions)[0];  if(state.firstTurn===null)state.firstTurn=state.firstDeploy||"p0";  const pi=Number(state.activePlayer);  const round=state.round;  const player=state.p[pi];  const firstPi=Number(state.firstTurn.slice(1));  const secondPi=firstPi===0?1:0;  const isFirstTurn=(round===1&&pi===firstPi);  const isLastTurn=(round===5&&pi===secondPi);

 const turnLabel=`BATTLE ROUND ${round} — ${esc(player.name||`PLAYER ${pi+1}`)}`;
 const prevDisabled=isFirstTurn;
 const nextDisabled=isLastTurn;

 const body=`${liveScorebar()}<div class="roundnav battle-turn-nav">
   <button class="btn" ${prevDisabled?"disabled":""} onclick="previousPlayerTurn()">←</button>
   <strong>${turnLabel}</strong>
   <button class="btn" ${nextDisabled?"disabled":""} onclick="nextPlayerTurn()">→</button>
 </div>
 <div class="battle-turn-indicator"><span>PLAYER ${pi+1} OF 2</span><span>ROUND ${round} OF 5</span></div>
 <div class="scoreboards single-player">${`<div class="scoreboard"><div class="playerhead"><div><strong>${esc(player.name)}</strong><div class="small">${esc(player.faction)} · Painting ${player.paint}/20</div></div><div><div class="small">PRIMARY</div><div class="tot" id="total${pi}">${primaryTotal(pi)}</div></div></div>${conditionList(pi)}${secondary(pi)}</div>`}</div>
 <div class="notice">Primary is calculated from the selected conditions. Secondary objectives are ticked when achieved and contribute 5 VP each.</div>`;

 const endDisabled=!isLastTurn;
 const rulesSearch=`<div class="battle-rules-search"><button class="btn primary" onclick="go('search');setTimeout(()=>{const q=document.querySelector('#rule-search');if(q)q.focus()},0)">🔍 SEARCH RULES</button></div>`;

 document.getElementById("app").innerHTML=`<div class="eyebrow">The Course of Battle</div><h1>Score Sheet</h1>${rulesSearch}${body}<div class="actions"><button class="btn" onclick="back()">← BACK</button><button type="button" class="btn danger" ${endDisabled?"disabled":""} onclick="endBattle()">END BATTLE →</button></div>`;
 renderNav();
}
function nextPlayerTurn(){
 const firstPi=Number((state.firstTurn||"p0").slice(1));
 const secondPi=firstPi===0?1:0;
 if(state.round===5 && state.activePlayer===secondPi)return;
 if(state.activePlayer===firstPi){state.activePlayer=secondPi;}
 else{state.activePlayer=firstPi;state.round=Math.min(5,state.round+1);}
 renderBattle();
 setTimeout(()=>window.scrollTo({top:0,left:0,behavior:"auto"}),0);
}
function previousPlayerTurn(){
 const firstPi=Number((state.firstTurn||"p0").slice(1));
 const secondPi=firstPi===0?1:0;
 if(state.round===1 && state.activePlayer===firstPi)return;
 if(state.activePlayer===secondPi){state.activePlayer=firstPi;}
 else{state.activePlayer=secondPi;state.round=Math.max(1,state.round-1);}
 renderBattle();
 setTimeout(()=>window.scrollTo({top:0,left:0,behavior:"auto"}),0);
}
function endBattle(){
 const firstPi=Number((state.firstTurn||"p0").slice(1));
 const secondPi=firstPi===0?1:0;
 if(state.round<5 || state.activePlayer!==secondPi){
   alert("The battle cannot be ended until the end of Battle Round 5, after the second player's turn.");
   return;
 }
 const body=`<div class="mission">
   <div class="num">CONFIRM END OF BATTLE</div>
   <h2>Are you sure?</h2>
   <p>Battle Round 5 has been reached. Ending the battle will take you to the final score.</p>
   <p class="small">If this was accidental, choose Continue Battle to return to the score sheet.</p>
 </div>`;
 document.getElementById("app").innerHTML=`<div class="eyebrow">The Aftermath</div><h1>End Battle</h1>${body}
 <div class="actions"><button type="button" class="btn" onclick="renderBattle()">← CONTINUE BATTLE</button>
 <button type="button" class="btn primary" onclick="confirmEndBattle()">END BATTLE →</button></div>`;
 renderNav();
}
function confirmEndBattle(){
 state.step="final";
 renderFinal();
}
function achievedSecondaryNames(pi){
 const names=[];
 const fixed=["Slay the Warlord","Linebreaker / Hold the Line","Attrition"];
 const achieved=window._secondary||{};
 for(let i=0;i<3;i++) if(achieved[`sec-${pi}-${i}`]) names.push(fixed[i]);
 state.p[pi].intent.forEach((idx,j)=>{
   const key=`sec-${pi}-${3+j}`;
   if(idx===3){
     if(state.p[pi].manifest.reduce((a,b)=>a+(Number(b)||0),0)>=5) names.push("Manifest");
   }else if(achieved[key]){
     names.push(flex[idx][0]);
   }
 });
 return names;
}
function renderFinal(){
 const mission=missions[state.mission]||{};
 const body=`<div class="mission">
   <div class="eyebrow">BATTLE REPORT</div>
   <div class="num">${esc(state.mission||"")}</div>
   <p>${esc(mission.flavour||"")}</p>
   <div class="notice" style="text-align:left">
     <strong>Shape of Battle</strong><br>${esc(state.twist||"Open Battle")}
     <br><span class="small">${esc(twistRules[state.twist]||"")}</span>
   </div>
 </div>
 <div class="final">${[0,1].map(pi=>`<div class="finalbox">
   <div class="eyebrow">PLAYER ${pi+1}</div>
   <h2>${esc(state.p[pi].name)}</h2>
   <div class="small">${esc(state.p[pi].faction)}</div>
   <div class="finalscore">${state.p[pi].paint+primaryTotal(pi)+secondaryTotal(pi)}</div>
   <div class="small">FINAL SCORE / 100</div>
   <div class="breakdown"><span>Painting</span><strong>${state.p[pi].paint} / 20</strong></div>
   <div class="breakdown"><span>Primary</span><strong>${primaryTotal(pi)} / 55</strong></div>
   <div class="breakdown"><span>Secondary</span><strong>${secondaryTotal(pi)} / 25</strong></div>
   <h3 style="margin-top:22px">Commander's Intent</h3>
   <div class="small">${state.p[pi].intent.map(idx=>{
     let text=flex[idx][0];
     if(idx===0) text+=` — ${state.p[pi].priority||"Location not recorded"}`;
     return esc(text);
   }).join("<br>")}</div>
   <h3 style="margin-top:22px">Primary by Round</h3>
   ${state.p[pi].primary.map((v,i)=>`<div class="breakdown"><span>Round ${i+1}</span><strong>${v} VP</strong></div>`).join("")}
   <h3 style="margin-top:22px">Secondaries Achieved</h3>
   <div class="small">${achievedSecondaryNames(pi).join("<br>")||"None"}</div>
 </div>`).join("")}</div>`;
 const a=state.p[0].paint+primaryTotal(0)+secondaryTotal(0);
 const b=state.p[1].paint+primaryTotal(1)+secondaryTotal(1);
 const winner=a===b?"DRAW":a>b?`${esc(state.p[0].name)} WINS`:`${esc(state.p[1].name)} WINS`;
 document.getElementById("app").innerHTML=`<div class="eyebrow">The Aftermath</div><h1>Final Scores</h1>
 <div class="mission"><div class="num">${winner}</div><h2>${a} — ${b}</h2></div>
 ${body}
 <div class="actions"><button class="btn" onclick="state.step='battle';renderBattle()">← BACK TO SCORE SHEET</button>
 <button class="btn primary" onclick="printResult()">PRINT / SAVE PDF</button></div>`;
 renderNav();
}
function printResult(){
 const escHtml=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 const mission=missions[state.mission]||{};
 const a=state.p[0].paint+primaryTotal(0)+secondaryTotal(0);
 const b=state.p[1].paint+primaryTotal(1)+secondaryTotal(1);
 const winner=a===b?'DRAW':a>b?`${escHtml(state.p[0].name)} WINS`:`${escHtml(state.p[1].name)} WINS`;
 const playerCard=pi=>{
   const p=state.p[pi];
   const intents=p.intent.map(idx=>{
     let t=flex[idx][0];
     if(idx===0) t+=` — ${p.priority||'Location not recorded'}`;
     return `<li>${escHtml(t)}</li>`;
   }).join('')||'<li>None selected</li>';
   const rounds=p.primary.map((v,i)=>`<span>R${i+1}: <b>${Number(v)||0}</b></span>`).join(' · ');
   const achieved=achievedSecondaryNames(pi).map(x=>`<li>${escHtml(x)}</li>`).join('')||'<li>None</li>';
   const win=a===b?'':(pi===0?(a>b?'WIN':''):(b>a?'WIN':''));
   return `<section class="p-card">
     <div class="p-head"><div><div class="label">PLAYER ${pi+1}</div><h2>${escHtml(p.name)}</h2><div class="faction">${escHtml(p.faction)}</div></div><div class="score"><em>${win}</em><strong>${pi===0?a:b}</strong><small>/100</small></div></div>
     <div class="score-row"><div><b>${p.paint}</b><span>PAINTING</span></div><div><b>${primaryTotal(pi)}</b><span>PRIMARY</span></div><div><b>${secondaryTotal(pi)}</b><span>SECONDARY</span></div></div>
     <div class="block"><h3>COMMANDER'S INTENT</h3><ul>${intents}</ul></div>
     <div class="block"><h3>PRIMARY BY ROUND</h3><div class="rounds">${rounds}</div></div>
     <div class="block"><h3>SECONDARIES ACHIEVED</h3><ul>${achieved}</ul></div>
   </section>`;
 };
 const report=`<div id="print-report" class="report">
   <header class="report-head"><div><div class="brand">PROHAMMER</div><div class="sub">BATTLE COMPANION · BATTLE REPORT</div></div><div class="winner"><span>${winner}</span><strong>${a} — ${b}</strong></div></header>
   <section class="mission"><div class="mission-main"><div class="label">MISSION</div><h1>${escHtml(state.mission||'')}</h1><p>${escHtml(mission.flavour||'')}</p></div><div class="twist"><div class="label">SHAPE OF BATTLE</div><b>${escHtml(state.twist||'Open Battle')}</b><p>${escHtml(twistRules[state.twist]||'')}</p></div></section>
   <div class="players">${playerCard(0)}${playerCard(1)}</div>
   <footer>PROHAMMER BATTLE COMPANION · ${new Date().toLocaleDateString('en-GB')}</footer>
 </div>`;

 // Build the report in the current tab. This avoids opening an about:blank tab and
 // lets the browser print the report directly from the page that contains the app.
 let old=document.getElementById('print-overlay');
 if(old) old.remove();
 const overlay=document.createElement('div');
 overlay.id='print-overlay';
 overlay.innerHTML=report;
 document.body.appendChild(overlay);
 document.body.classList.add('printing-result');

 const cleanup=()=>{
   document.body.classList.remove('printing-result');
   overlay.remove();
   window.removeEventListener('afterprint',cleanup);
 };
 window.addEventListener('afterprint',cleanup);
 setTimeout(()=>window.print(),50);
}

function saveResult(){
 printResult();
}
render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(() => {});
  });
}
</script>
</body></html>
